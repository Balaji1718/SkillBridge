<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillBridge - Student Skill Exchange</title>
    <meta name="description" content="Exchange skills with students — no money needed" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2a9d8f" />
    <meta name="author" content="SkillBridge" />

    <meta property="og:title" content="SkillBridge - Student Skill Exchange" />
    <meta property="og:description" content="Exchange skills with students — no money needed" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/placeholder.svg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@SkillBridge" />
    <meta name="twitter:image" content="/placeholder.svg" />
    <script>
      (function () {
        try {
          var storageKey = "skillbridge-theme";
          var stored = localStorage.getItem(storageKey);
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = stored === "dark" || (stored !== "light" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";

          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (!themeColor) {
            themeColor = document.createElement("meta");
            themeColor.setAttribute("name", "theme-color");
            document.head.appendChild(themeColor);
          }
          themeColor.setAttribute("content", isDark ? "#111827" : "#f8fafc");
        } catch (error) {
          // Ignore theme boot errors and fall back to CSS defaults.
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
