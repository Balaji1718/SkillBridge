<!doctype html>
<html>
  <body style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial; color:#111;">
    <div style="max-width:600px;margin:24px auto;padding:20px;border:1px solid #eee;border-radius:8px;">
      <h3 style="margin:0 0 8px;">New review received</h3>
      <p>Hi {{name}},</p>
      <p>{{reviewerName}} left you a {{rating}}-star review:</p>
      <blockquote style="background:#f9f9f9;border-left:4px solid #eee;padding:8px;margin:8px 0;">{{comment}}</blockquote>
      <p style="margin-top:12px;color:#666;font-size:13px;">— SkillBridge</p>
    </div>
  </body>
</html>
